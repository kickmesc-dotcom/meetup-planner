[project]
name = "meetup-planner-backend"
version = "0.1.0"
description = "Telegram Mini App backend: bot + REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Аудит 26.10.2026 (S-18): fastapi 0.115.6 / starlette 0.41.3 тянули 14
    # advisories Starlette. Подъём был задержан не тестами, а тем, что в
    # Starlette 1.x `app.routes` больше не разворачивается в плоский список
    # (33 объекта вместо 359), а на этом списке жили `/api/meta` и проверки прав.
    # Перечисление переписано на схему OpenAPI (`routes_meta._routes_from_schema`)
    # и `app/routing.iter_route_objects`, после чего подъём стало можно измерить:
    # 354 ручки, тот же состав `features`, полный `pytest` зелёный.
    "fastapi==0.162.0",
    # Пин явный: FastAPI разрешает диапазон, а боевая сборка должна быть
    # воспроизводимой (тот же урок, что с aiogram/aiohttp 26.10).
    "starlette==1.10.0",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    # 2.13 вместо 2.9 — не косметика: это и есть разгадка S-19 (см. ниже).
    "pydantic==2.13.5",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "httpx==0.27.2",
    # Поднято по аудиту 26.10.2026 (S-6): в 0.0.17 было 8 advisories, включая DoS
    # через деформацию multipart-boundary — а мы принимаем фотоотчёты. Минимум
    # для закрытия всех — 0.0.31.
    "python-multipart==0.0.32",
    "aiosqlite==0.20.0",
    "apscheduler==3.10.4",
    "tzdata==2024.2",
    # ПАМЯТЬ (S-19, закрыто 30.10.2026). Контейнер Amvera живёт на тарифе
    # «Начальный» — 0,5 ГБ RAM, и раньше подъём aiogram упирался в неё:
    #
    #     aiogram 3.13.1 + aiohttp 3.10.11 + pydantic 2.9  → 273 МБ
    #     aiogram 3.31.0 + aiohttp 3.14.5  + pydantic 2.9  → 559 МБ  ← падало
    #
    # Вывод 26.10 был неверным: винили aiogram. Замер 30.10 (та же команда,
    # «импорт библиотек → импорт app.main → сборка диспетчера») показал, что
    # 435 МБ из тех 559 — это aiogram 3.31 **в паре со старым pydantic 2.9**: он
    # строит и держит схемы моделей многократно. С pydantic 2.13 тот же aiogram
    # стоит 175 МБ, и полный старт выходит 248 МБ — столько же, сколько на
    # старой паре. То есть aiohttp 3.14.5 (0 advisories вместо 74) доступен без
    # смены тарифа.
    #
    # Побочная находка того же замера: `routes_admin` ссылался на `Literal` без
    # импорта — pydantic 2.9 это проглатывал, 2.13 падал на сборке OpenAPI.
    "aiohttp==3.14.5",
    "aiogram==3.31.0",
    "aiohttp-socks==0.10.1",
    # Web push вне Telegram (шаг 2.4): шифрование payload + подпись VAPID.
    "pywebpush==2.0.3",
]

[project.optional-dependencies]
# Перевод данных на месте (план, 11). Отдельная группа, а не основные зависимости
# потому, что это единственная часть проекта с «тяжёлой» начинкой: CTranslate2
# тянет нативные библиотеки. Рантайм-память определяют не они, а веса моделей
# (780 МБ), поэтому в образе живёт только движок, а модели грузятся лишь там,
# где заданы `TRANSLATE_*` (на Amvera с 0,5 ГБ переменные пусты).
#
# `tokenizers` нужен для узбекской модели (у дообученной m2m100 токенизатор —
# `tokenizer.json`, а не sentencepiece). `transformers` и `torch` сюда НЕ входят:
# конверсия модели делается на рабочей машине один раз, сервер только читает
# готовые веса — иначе образ вырос бы на гигабайт ради одного шага сборки.
mt = [
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.1",
    "tokenizers==0.23.3",
    "huggingface_hub==2.3.0",
]

dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
