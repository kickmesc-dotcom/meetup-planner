[project]
name = "meetup-planner-backend"
version = "0.1.0"
description = "Telegram Mini App backend: bot + REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Аудит 26.10.2026 (S-18): fastapi 0.115.6 / starlette 0.41.3 тянули 14
    # advisories Starlette. Подъём был задержан не тестами, а тем, что в
    # Starlette 1.x `app.routes` больше не разворачивается в плоский список
    # (33 объекта вместо 359), а на этом списке жили `/api/meta` и проверки прав.
    # Перечисление переписано на схему OpenAPI (`routes_meta._routes_from_schema`)
    # и `app/routing.iter_route_objects`, после чего подъём стало можно измерить:
    # 354 ручки, тот же состав `features`, полный `pytest` зелёный.
    "fastapi==0.162.0",
    # Пин явный: FastAPI разрешает диапазон, а боевая сборка должна быть
    # воспроизводимой (тот же урок, что с aiogram/aiohttp 26.10).
    "starlette==1.10.0",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "httpx==0.27.2",
    # Поднято по аудиту 26.10.2026 (S-6): в 0.0.17 было 8 advisories, включая DoS
    # через деформацию multipart-boundary — а мы принимаем фотоотчёты. Минимум
    # для закрытия всех — 0.0.31.
    "python-multipart==0.0.32",
    "aiosqlite==0.20.0",
    "apscheduler==3.10.4",
    "tzdata==2024.2",
    # ВАЖНО, про память (замеры 26.10.2026, Python 3.12, тот же контур). Контейнер
    # Amvera живёт на тарифе «Начальный» — 0,5 ГБ RAM. Пик памяти приложения на
    # импорте целиком определяется aiogram:
    #
    #     aiogram 3.13.1 + aiohttp 3.10.11 → 273 МБ   ← эта конфигурация
    #     aiogram 3.20.0 + aiohttp 3.11.11 → 294 МБ
    #     aiogram 3.24.0                   → 354 МБ
    #     aiogram 3.28.2                   → 391 МБ
    #     aiogram 3.31.0 + aiohttp 3.14.5 → 559 МБ   ← не влезает, контейнер падал
    #
    # Что произошло: подняв `aiohttp` до 3.14.5 (там 0 advisories вместо 74), мы
    # вынуждены были поднять и `aiogram` — до 3.13.1 он требовал `aiohttp<3.11`, а
    # до 3.28 — `<3.14`. Свежий aiogram (3.29+, он и разрешает `aiohttp<3.15`)
    # стоит +289 МБ на импорте, Amvera это не пропускает и уходит в перезапуск
    # («Insufficient RAM for project …, upgrade the project plan»).
    #
    # Поэтому пока держим проверенную по памяти пару, а переход на свежий
    # aiohttp — в плане (нужен тариф от 1 ГБ: `docs/MEGAPROMT3_PLAN.md`, S-19).
    "aiohttp==3.10.11",
    "aiogram==3.13.1",
    "aiohttp-socks==0.10.1",
    # Web push вне Telegram (шаг 2.4): шифрование payload + подпись VAPID.
    "pywebpush==2.0.3",
]

[project.optional-dependencies]
# Перевод данных на месте (план, 11). Отдельная группа, а не основные зависимости
# потому, что это единственная часть проекта с «тяжёлой» начинкой: CTranslate2
# тянет нативные библиотеки. Рантайм-память определяют не они, а веса моделей
# (780 МБ), поэтому в образе живёт только движок, а модели грузятся лишь там,
# где заданы `TRANSLATE_*` (на Amvera с 0,5 ГБ переменные пусты).
#
# `tokenizers` нужен для узбекской модели (у дообученной m2m100 токенизатор —
# `tokenizer.json`, а не sentencepiece). `transformers` и `torch` сюда НЕ входят:
# конверсия модели делается на рабочей машине один раз, сервер только читает
# готовые веса — иначе образ вырос бы на гигабайт ради одного шага сборки.
mt = [
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.1",
    "tokenizers==0.23.3",
    "huggingface_hub==2.3.0",
]

dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
