[project]
name = "meetup-planner-backend"
version = "0.1.0"
description = "Telegram Mini App backend: bot + REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "aiogram==3.13.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "httpx==0.27.2",
    # Поднято по аудиту 26.10.2026 (S-6): в 0.0.17 было 8 advisories, включая DoS
    # через деформацию multipart-boundary — а мы принимаем фотоотчёты. Минимум
    # для закрытия всех — 0.0.31.
    "python-multipart==0.0.32",
    "aiosqlite==0.20.0",
    "apscheduler==3.10.4",
    "tzdata==2024.2",
    # aiohttp приходит транзитивно от aiogram, но пишем явно: 3.10.11 нёс 74
    # advisories (неограниченная очередь pipelined-запросов, позднее ограничение
    # размера полей, CRLF в multipart). Минимум для закрытия — 3.14.4.
    "aiohttp==3.14.5",
    "aiohttp-socks==0.10.1",
    # Web push вне Telegram (шаг 2.4): шифрование payload + подпись VAPID.
    "pywebpush==2.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
