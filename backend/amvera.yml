# Конфиг сборки/запуска для Amvera Cloud (cloud.amvera.ru).
#
# Два имени файла — не случайность: платформа в разное время читала то
# `amvera.yml`, то `amvera.yaml` (MCP-шаблон Amvera отдаёт `.yaml`). Держим оба
# идентичными, чтобы поведение не зависело от того, какое имя прочитает сборщик.
#
# ПОЧЕМУ ЭТО КРИТИЧНО ДЛЯ ПОРТА: если сервис доступа не увидит `run.containerPort`,
# он остаётся на дефолтном 80, а uvicorn слушает 7860 — домен отвечает 503
# «С приложением что-то не так» при полностью живом контейнере. Именно так
# выглядел деплой 20.10.2026, когда `tools/deploy-amvera.py` пересоздал зеркало
# и не перенёс эти файлы: конфиг нужно держать ЗДЕСЬ, рядом с Dockerfile.
#
# ВАЖНО про поля: у Amvera строгая схема. Неизвестное поле (например
# `build.useCache`) роняет разбор конфига целиком — платформа пишет
# «Configuration error … unknown fields» и молча работает на дефолтах. Поэтому
# здесь только те ключи, которые она точно понимает.
#
# Сборка идёт по существующему Dockerfile (в корне backend-репо). Dockerfile
# слушает $PORT (дефолт 7860) и сам гонит `alembic upgrade head` перед uvicorn.
#
# ВАЖНО (переезд с HF под РКН): на российском Amvera прямой доступ к
# api.telegram.org есть, поэтому env BOT_API_SERVER на Amvera НЕ задаём — бот
# ходит на Telegram напрямую (dispatcher._resolve_api_server: пусто = direct).
meta:
  environment: docker
  toolchain:
    name: docker
    version: "20"

build:
  dockerfile: Dockerfile

run:
  # Порт, который слушает приложение внутри контейнера (uvicorn --port $PORT).
  # Должен совпадать с ENV PORT в Dockerfile (7860).
  containerPort: 7860
  # Постоянное хранилище нам не нужно (вся персистентность — в Neon Postgres),
  # но путь по умолчанию /data безвреден; оставляем дефолт.
