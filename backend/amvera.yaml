# ДУБЛИКАТ amvera.yml — платформа читает то .yml, то .yaml.
# Правки вносить в оба файла одновременно, иначе порт 7860 потеряется
# и домен снова начнёт отдавать 503.
meta:
  environment: docker
  toolchain:
    name: docker
    version: "20"

build:
  dockerfile: Dockerfile

run:
  # Порт, который слушает приложение внутри контейнера (uvicorn --port $PORT).
  # Должен совпадать с ENV PORT в Dockerfile (7860).
  containerPort: 7860
  # Постоянное хранилище нам не нужно (вся персистентность — в Neon Postgres),
  # но путь по умолчанию /data безвреден; оставляем дефолт.
