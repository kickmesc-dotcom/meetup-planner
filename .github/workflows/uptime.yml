name: Uptime

# Внешний монитор (B2B_PLATFORM_PLAN, 5.2). Внутренние метрики видят запросы,
# которые до сервиса дошли; этот workflow проверяет, что сервис вообще
# отвечает снаружи. Разные вопросы: «API тормозит» и «API лежит и не отвечает
# никому» — второй внутренние счётчики не увидят, потому что запросов нет.
#
# Почему GitHub, а не UptimeRobot: никаких ключей и лишнего аккаунта. Падение
# джоба приходит владельцу письмом от GitHub (если включены уведомления о
# failed workflows). Cron в GitHub не пунктуален: 10 минут — это «примерно
# раз в 10–20 минут», для «лежит ли всё» достаточно.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API /readyz отвечает и видит базу
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 15 --retry 2 --retry-delay 5 \
            https://meetup-planner-youmakemefry.waw0.amvera.tech/readyz)
          echo "$body"
          # 200 мало: `/readyz` отдаёт 200 и когда база «ok», и когда нет —
          # проверяем содержимое, иначе монитор молчит при мёртвой БД.
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"db":"ok"'

      - name: Мини-апп отдаётся
        run: |
          set -euo pipefail
          code=$(curl -fsS --max-time 15 --retry 2 -o /dev/null \
            -w '%{http_code}' https://semitaskbot.pages.dev/)
          echo "HTTP $code"
          test "$code" = "200"
