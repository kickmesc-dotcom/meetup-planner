# CI: тесты, типы и сборка на каждый пуш (B2B_PLATFORM_PLAN, шаг 5.1).
#
# Зачем. До этого «всё зелёное» означало «на моей машине зелёное»: пуш в main
# мог привезти красные тесты, а узнавали об этом на следующем деплое или от
# клиента. Здесь те же команды, что мы запускаем руками, выполняются на чистой
# машине GitHub — без локальной .venv, без забытых пакетов и с теми же флагами.
#
# Почему линтер не входит. В проекте нет `eslint.config.*`, и `npm run lint`
# падает на конфиге, а не на коде: красный CI из-за отсутствующего конфига
# быстро приучает игнорировать красный. Как только конфиг появится — добавить
# шаг сюда.
#
# Почему ограничены форки vitest. Без `maxForks` прогон на 2 vCPU раннере
# падает по таймаутам jsdom (это же воспроизводится локально на слабых
# машинах), и CI врал бы «тесты сломаны» вместо «машина не тянет».
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: важно последнее
# состояние, а не история очереди.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Тесты сами выставляют эти значения через `setdefault`, но явно — надёжнее:
    # если один тест забудет, прогон не упадёт на импорте `Settings`.
    env:
      BOT_TOKEN: test-token
      TG_WEBHOOK_SECRET: test-secret
      MINI_APP_URL: https://example.com
      DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # `-e .[dev]` — ровно то, что ставит разработчик: версии закреплены в
      # `pyproject.toml`, поэтому CI и рабочая машина получают одно и то же.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `pipefail` обязателен: без него `tee` вернёт 0, шаг станет зелёным, и
      # красный CI перестанет значить хоть что-нибудь. `-p no:cacheprovider` —
      # раннер всё равно одноразовый.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider 2>&1 | tee pytest.log

      # Логи приватного репозитория без токена не читаются, а без хвоста
      # падения красный CI — это «что-то сломалось». Аннотация прикрепляется к
      # коммиту и видна всем, у кого есть доступ к репозиторию.
      # Аудит уже установленных пакетов. Без автоапгрейда: поднятие версии —
      # отдельный коммит с прогоном тестов, потому что именно так 26.10.2026
      # обнаружился конфликт aiogram/aiohttp. Красный шаг здесь — сигнал, а не
      # повод отключить проверку.
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip setuptools pip-audit
          pip-audit --skip-editable

      - name: Report failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path("pytest.log").read_text(errors="replace").splitlines()[-80:]
          text = "%0A".join(line.replace("%", "%25") for line in lines)
          print(f"::error title=Pytest failed::{text}")
          PY

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, а не `npm install`: lock-файл — источник правды, и CI не
      # должен молча поднимать версии пакетов.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Покрытие считается в том же прогоне, что и тесты: второй запуск
      # удваивал бы время джобы. Пороги лежат в `vitest.config.ts`.
      - name: Tests and coverage
        run: npx vitest run --coverage --poolOptions.forks.maxForks=2 --poolOptions.forks.minForks=1

      # Сборка последней: она ловит ошибки, которые не видят типы (импорт
      # чанка, размер бандла, отсутствующий ассет).
      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      # Только прод-зависимости: dev-инструменты в бандл не попадают и
      # обновляются отдельно, чтобы не красить CI чужой уязвимостью сборки.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Lighthouse меряет то, чего не видит бюджет: LCP/CLS/TBT в мобильном
      # профиле на собранной статике. Chrome на ubuntu-раннере уже есть.
      - name: Lighthouse CI
        run: npx lhci autorun

      # Браузер ставится отдельным шагом: на раннере его нет, а кеш Playwright
      # между прогонами не сохраняется.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
