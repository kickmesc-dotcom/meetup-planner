<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta
      name="description"
      content="Смены, задачи и чек-листы команды: вход по почте, работа с телефона и компьютера без Telegram."
    />
    <title>SemiTaskBot — рабочий бот ресторана</title>

    <!-- PWA (B2B_PLATFORM_PLAN, шаг 2.3): установка на домашний экран. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Цвет адресной строки в standalone. Две темы — как в приложении:
         светлая кнопка #1c6fb8, тёмный фон #17212b. -->
    <meta name="theme-color" content="#1c6fb8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SemiTask" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      SDK Telegram грузится ОТЛОЖЕННО (M1, docs/MOBILE_PARALLEL.md).

      Почему не как раньше: без `defer` браузер останавливал разбор HTML и ждал
      ответа telegram.org — чужого домена в критическом пути первого кадра.
      Вне Telegram (PWA, установленное приложение, браузер) этот скрипт не
      нужен вовсе, а в России его доступность не гарантирована: белый экран на
      несколько секунд — ровно то, что человек читает как «приложение не работает».
      С `defer` порядок сохраняется: скрипт выполняется до бандла (модули тоже
      отложены), но разбор страницы его больше не ждёт.
    -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>

    <!--
      Заставка первого кадра (план, раздел 9).

      Пока грузится бандл (≈290 kB gzip на мобильном канале — это секунды),
      человек видел пустую белую страницу и решал, что приложение не открылось.
      Здесь статика без единого запроса: имя продукта и каркас будущего экрана.

      Стили встроены, а не взяты из бандла: файл со стилями приходит позже.
      Тема учитывается через prefers-color-scheme — иначе на тёмном телефоне
      вспыхивал бы белый прямоугольник.

      React убирает этот узел сам (см. `main.tsx`), поэтому дублирования нет.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #17212b;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #17212b;
          color: #f1f5f9;
        }
      }
      #boot-splash {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.75;
      }
      #boot-splash .boot-mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: #1c6fb8;
      }
      #boot-splash .boot-card {
        height: 88px;
        border-radius: 14px;
        background: rgba(28, 111, 184, 0.14);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-splash .boot-card:first-of-type {
        height: 48px;
      }
      #boot-splash .boot-fill {
        flex: 1;
        min-height: 60px;
        border-radius: 14px;
        background: rgba(28, 111, 184, 0.08);
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-card {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-tg-bg text-tg-text">
    <div id="root">
      <div id="boot-splash" aria-hidden="true">
        <div class="boot-brand"><span class="boot-mark"></span>SemiTask</div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
        <div class="boot-fill"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
